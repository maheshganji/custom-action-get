name: Proxy Test - DevOps Change

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Build Step
        run: echo "Build complete."

  dummy-step-1:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Unit Tests
        run: |
          echo "Running unit tests..."
          sleep 5
          echo "All unit tests passed."

  dummy-step-2:
    name: Run Integration Tests
    needs: dummy-step-1
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Integration Tests
        run: |
          echo "Running integration tests..."
          sleep 5
          echo "All integration tests passed."

  changeApproval:
    name: ServiceNow Change Approval
    needs: dummy-step-2
    runs-on: ubuntu-latest

    services:
      squid:
        image: ubuntu/squid:latest
        ports:
          - 3128:3128

    env:
      HTTPS_PROXY: http://localhost:3128

    steps:
      - name: Wait for Squid to start
        run: |
          echo "Waiting for Squid proxy to be ready..."
          for i in $(seq 1 30); do
            if curl -x http://localhost:3128 -s -o /dev/null -w "%{http_code}" https://www.google.com 2>/dev/null | grep -q '200'; then
              echo "Squid proxy is ready!"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 2
          done

      - name: Verify Proxy Connectivity
        run: |
          echo "HTTPS_PROXY is set to: $HTTPS_PROXY"
          curl -x $HTTPS_PROXY -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://www.google.com || echo "Proxy connectivity check failed"

      - name: ServiceNow Change Approval
        uses: ServiceNow/servicenow-devops-change@feature/https-proxy-agent
        id: create
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change Approval'
          change-request: '{"setCloseCode":"true","attributes":{"short_description":"Automated Software Deployment via Proxy","description":"Automated Software Deployment routed through corporate proxy.","assignment_group":"a715cd759f2002002920bde8132e7018","implementation_plan":"Software update is tested and results can be found in Test Summaries Tab.","backout_plan":"When software fails in production, the previous software release will be re-deployed.","test_plan":"Testing if the software was successfully deployed"}}'
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Show Squid Proxy Access Logs
        if: always()
        run: docker logs $(docker ps -aq --filter "ancestor=ubuntu/squid:latest") 2>&1 | grep -E "CONNECT|TCP" || echo "No proxy logs found"

      - name: Output of Change Creation
        run: echo "change-request-number=${{ steps.create.outputs.change-request-number }} change-request-sys-id=${{ steps.create.outputs.change-request-sys-id }}"




  getchange:
    needs: changeApproval
    runs-on: ubuntu-latest
    if: always()
    name: ServiceNow DevOps Get Change
    outputs:
      change-request-number: '${{ steps.get_change.outputs.change-request-number }}'
    steps:
      - name: ServiceNow DevOps Get Change
        uses: ServiceNow/servicenow-devops-get-change@CSTASK1513682
        id: get_change
        with:
          instance-url: '${{ secrets.SN_INSTANCE_URL }}'
          # devops-integration-user-name: '${{ secrets.SN_DEVOPS_USER }}'
          # devops-integration-user-password: '${{ secrets.SN_DEVOPS_PASSWORD }}'
          devops-integration-token: '${{ secrets.SN_DEVOPS_TOKEN }}'
          tool-id: '${{ secrets.SN_ORCHESTRATION_TOOL_ID }}'
          context-github: '${{ toJSON(github) }}'
          change-details: '{"build_number":"","pipeline_name":"","stage_name":"ServiceNow Change Approval"}'
      - name: Output of ServiceNow DevOps Get Change
        run: >-
          echo 'Output of ServiceNow DevOps Get Change is ->
          change-request-number = ${{
          steps.get_change.outputs.change-request-number }}' >> $GITHUB_OUTPUT
  updatechange:
    needs: getchange
    runs-on: ubuntu-latest
    name: ServiceNow DevOps Update Change
    if: always()
    steps:
      - name: ServiceNow DevOps Update Change
        uses: ServiceNow/servicenow-devops-update-change@CSTASK1513682
        id: update_change
        with:
          instance-url: '${{ secrets.SN_INSTANCE_URL }}'
          # devops-integration-user-name: '${{ secrets.SN_DEVOPS_USER }}'
          # devops-integration-user-password: '${{ secrets.SN_DEVOPS_PASSWORD }}'
          devops-integration-token: '${{ secrets.SN_DEVOPS_TOKEN }}'
          tool-id: '${{ secrets.SN_ORCHESTRATION_TOOL_ID }}'
          context-github: '${{ toJSON(github) }}'
          change-request-number: '${{needs.getchange.outputs.change-request-number}}'
          change-request-details: >-
            {"state":"3","close_code":"successful_issues","close_notes":"Test results successful with upadate change step"}

  deploy:
    name: Deploy
    needs: changeApproval
    runs-on: ubuntu-latest

    steps:
      - name: Run Deployment Script
        run: echo "Deployment Finished....."
